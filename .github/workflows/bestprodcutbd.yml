name: BDStall Auto Blogger Bot

on:
  schedule:
    - cron: '0 2,10,18 * * *' # দিনে ৩ বার স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch: # ম্যানুয়ালি চালুর বাটন

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Post Script
      env:
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BDSTALL_AFFILIATE_ID: ${{ secrets.BDSTALL_AFFILIATE_ID }}
      run: python bestproductbd.py
