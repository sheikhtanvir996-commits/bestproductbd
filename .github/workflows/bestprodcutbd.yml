name: Blogger Auto Post Bot

on:
  schedule:
    # প্রতিদিন নির্দিষ্ট সময়ে অটোমেটিক পোস্ট করার জন্য (যেমন: প্রতিদিন সকাল ৬টায়)
    - cron: '0 0 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন চালু করার জন্য

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # পাইথনের আপডেট ভার্সন

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-genai google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Run Auto Post Script
      env:
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        BDSTALL_AFFILIATE_ID: ${{ secrets.BDSTALL_AFFILIATE_ID }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      run: python bestproductbd.py
